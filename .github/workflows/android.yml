name: Android

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-release:
    runs-on: ubuntu-latest
    name: Build release APK
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle
      - name: make
        run: cd android && ./gradlew clean && ./gradlew assembleRelease --no-daemon
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: android-release.apk
          path: android/build/outputs/apk/release/espeak-release-unsigned.apk
          retention-days: 2
